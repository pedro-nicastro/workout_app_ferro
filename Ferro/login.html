<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FERRO — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles/style.css" />
</head>
<body>
<div class="screen">
  <div class="brand">
    <h1 class="display">Ferro</h1>
    <p>Log in to see today's workout</p>
  </div>

  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="seu@email.com" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" required />
    </div>

    <div class="form-status" id="status" role="alert" aria-live="polite"></div>
    <button id="login-button" type="submit">Log in</button>
  </form>

  <div class="alt">Don't have an account yet? <a href="register.html">Create account</a></div>
</div>

<script src="assets/scripts/api.js"></script>
<script>
  var form = document.getElementById('login-form');
  var status = document.getElementById('status');
  var button = document.getElementById('login-button');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    status.textContent = '';
    status.className = 'form-status';

    button.disabled = true;
    button.textContent = 'Entrando...';

    try {
      await FerroApi.login({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      window.location.href = 'workout.html';
    } catch (error) {
      status.textContent = error.message;
      status.classList.add('error');
      button.disabled = false;
      button.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
