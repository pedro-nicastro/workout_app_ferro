<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FERRO — Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles/style.css" />
</head>
<body>
<div class="screen">
  <header>
    <div class="date">Last 6 weeks</div>
    <h1 class="display">Progress</h1>
  </header>

  <main>
    <div class="section-head">Weekly volume</div>
    <div class="chart">
      <div class="bar-wrap"><div class="bar" style="height:52%"></div><div class="bar-label">W1</div></div>
      <div class="bar-wrap"><div class="bar" style="height:61%"></div><div class="bar-label">W2</div></div>
      <div class="bar-wrap"><div class="bar" style="height:58%"></div><div class="bar-label">W3</div></div>
      <div class="bar-wrap"><div class="bar" style="height:74%"></div><div class="bar-label">W4</div></div>
      <div class="bar-wrap"><div class="bar" style="height:69%"></div><div class="bar-label">W5</div></div>
      <div class="bar-wrap"><div class="bar current" style="height:88%"></div><div class="bar-label">W6</div></div>
    </div>
    <div class="chart-note">Total volume (kg) lifted per week</div>

    <div class="section-head">Personal records</div>
    <div class="prs">
      <div class="pr"><span class="lift">Barbell bench press</span><span class="val">80kg × 5</span></div>
      <div class="pr"><span class="lift">Squat</span><span class="val">110kg × 5</span></div>
      <div class="pr"><span class="lift">Deadlift</span><span class="val">140kg × 3</span></div>
      <div class="pr"><span class="lift">Overhead press</span><span class="val">50kg × 6</span></div>
    </div>
  </main>

  <nav>
    <a href="workout.html"><span class="icon"></span>Today</a>
    <a href="plans.html"><span class="icon"></span>Plans</a>
    <a href="history.html"><span class="icon"></span>History</a>
    <a class="active"  href="progress.html"><span class="icon"></span>Progress</a>
    <a href="profile.html"><span class="icon"></span>Profile</a>
  </nav>
</div>
</body>
</html>
