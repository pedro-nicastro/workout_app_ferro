spring.application.name=ferro-backend
server.port=${SERVER_PORT:8081}

# XAMPP / MariaDB 10.4.x
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/ferro_db?useSsl=false&serverTimezone=America/Sao_Paulo&connectTimeout=3000&socketTimeout=5000}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# O backend sobe mesmo que o banco esteja desligado; a API /health mostra a falha.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jackson.default-property-inclusion=non_null
spring.sql.init.mode=never
