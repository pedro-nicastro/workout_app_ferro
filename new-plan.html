<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FERRO — New plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
<div class="screen">
  <header>
    <div class="date"><a href="plans.html" style="color:inherit; text-decoration:none;">‹ Plans</a></div>
    <h1 class="display" id="page-title">New plan</h1>
  </header>

  <main>
    <div class="manage-note" id="mode-info">
      Choose exactly which days are workouts and which are rest days.
    </div>

    <div class="field">
      <label for="plan-name">Workout name</label>
      <input id="plan-name" type="text" placeholder="Ex: Workout ABC">
    </div>

    <div class="section-head" style="margin-top:18px;">
      <span>Week</span>
      <span id="week-summary" style="color:var(--dim); font-size:12px;"></span>
    </div>

    <div class="week-selector" id="week-selector" aria-label="Escolha os days de training">
      <!-- Botões gerados pelo JavaScript -->
    </div>

    <div class="week-legend">
      <span><i class="legend-dot training"></i> Workout</span>
      <span><i class="legend-dot rest"></i> Rest</span>
      <span>Click to toggle</span>
    </div>

    <div class="warn-text" id="day-warning" style="display:none;"></div>

    <div class="section-head" style="margin-top:22px;">
      <span>Workout days</span>
      <span id="day-counter" style="color:var(--dim); font-size:12px;"></span>
    </div>

    <div id="days-container"></div>

    <button class="cta" id="save-button" style="width:100%; border:none; cursor:pointer; margin-top:20px;">Save plan</button>
    <button class="btn-outline" id="cancel-button" type="button">Cancel</button>
  </main>
</div>

<script src="assets/scripts/api.js"></script>
<script>
  if (!FerroApi.requireLogin()) throw new Error('session missing');

  var DAYS = [
    { index: 0, short: 'Sun', name: 'Sunday' },
    { index: 1, short: 'Mon', name: 'Monday' },
    { index: 2, short: 'Tue', name: 'Tuesday' },
    { index: 3, short: 'Wed', name: 'Wednesday' },
    { index: 4, short: 'Thu', name: 'Thursday' },
    { index: 5, short: 'Fri', name: 'Friday' },
    { index: 6, short: 'Sat', name: 'Saturday' }
  ];

  var LETTERS = 'ABCDEFG';
  var container = document.getElementById('days-container');
  var weekSelector = document.getElementById('week-selector');
  var warning = document.getElementById('day-warning');
  var dayCounter = document.getElementById('day-counter');
  var weekSummary = document.getElementById('week-summary');
  var params = new URLSearchParams(window.location.search);
  var planId = params.get('id');
  var editingPlan = null;

  // Guarda os data de cada day mesmo quando ele é temporariamente marcado como descanso.
  var week = {
    0: null, 1: null, 2: null, 3: null, 4: null, 5: null, 6: null
  };

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function defaultDayName(index) {
    return 'Workout for ' + DAYS[index].name;
  }

  function createDayData(index, data) {
    data = data || {};
    return {
      weekday: index,
      name: data.name || defaultDayName(index),
      exercises: Array.isArray(data.exercises) ? data.exercises.map(function(ex) {
        return {
          name: ex.name || '',
          sets: ex.sets || '',
          reps: ex.reps || '',
          weight: ex.weight || ''
        };
      }) : []
    };
  }

  function exerciseRowHtml(exercise) {
    exercise = exercise || {};
    return '' +
      '<div class="exercise-row">' +
        '<input type="text" class="ex-name" value="' + escapeHtml(exercise.name || '') + '" placeholder="E.g. Bench press" aria-label="Exercise">' +
        '<input type="text" class="ex-sets" value="' + escapeHtml(exercise.sets || '') + '" placeholder="4" aria-label="Sets">' +
        '<input type="text" class="exercise-reps" value="' + escapeHtml(exercise.reps || '') + '" placeholder="8-12" aria-label="Reps">' +
        '<input type="text" class="ex-weight" value="' + escapeHtml(exercise.weight || '') + '" placeholder="70kg" aria-label="Weight">' +
        '<button type="button" class="remove-row" title="Remove exercise" aria-label="Remove exercise">×</button>' +
      '</div>';
  }

  function dayBlockHtml(index) {
    var day = week[index] || createDayData(index);
    var exercises = Array.isArray(day.exercises) ? day.exercises : [];
    var rows = exercises.length ? exercises.map(exerciseRowHtml).join('') : exerciseRowHtml();
    var defaultName = day.name || defaultDayName(index);

    return '' +
      '<div class="dropdown day-block" data-day="' + index + '">' +
        '<button class="list-item" type="button" aria-expanded="false">' +
          '<span><b>' + DAYS[index].short + '</b> · ' + escapeHtml(defaultName) + '</span>' +
          '<span class="chev">›</span>' +
        '</button>' +
        '<div class="dropdown-panel">' +
          '<div class="dropdown-panel-inner">' +
            '<div class="field" style="margin-bottom:14px;">' +
              '<label>' + DAYS[index].name + ' — workout name</label>' +
              '<input type="text" class="day-name-input" value="' + escapeHtml(defaultName) + '" placeholder="E.g. Chest and Triceps">' +
            '</div>' +
            '<div class="row-labels"><span>Exercise</span><span>Sets</span><span>Reps</span><span>Weight</span><span></span></div>' +
            '<div class="exercises-list">' + rows + '</div>' +
            '<button type="button" class="add-row-btn">+ Exercise</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function readDayBlock(index) {
    var block = container.querySelector('.day-block[data-day="' + index + '"]');
    if (!block) return;

    var exercises = Array.prototype.map.call(
      block.querySelectorAll('.exercise-row'),
      function(row) {
        return {
          name: row.querySelector('.ex-name').value.trim(),
          sets: row.querySelector('.ex-sets').value.trim(),
          reps: row.querySelector('.exercise-reps').value.trim(),
          weight: row.querySelector('.ex-weight').value.trim()
        };
      }
    ).filter(function(ex) { return ex.name; });

    week[index] = {
      weekday: index,
      name: block.querySelector('.day-name-input').value.trim() || defaultDayName(index),
      exercises: exercises
    };
  }

  function saveBlocksToMemory() {
    Array.prototype.forEach.call(container.querySelectorAll('.day-block'), function(block) {
      readDayBlock(parseInt(block.dataset.day, 10));
    });
  }

  function trainingDays() {
    return DAYS.map(function(day) { return day.index; })
      .filter(function(index) { return week[index] !== null; });
  }

  function renderWeek() {
    var selectedDays = trainingDays();

    weekSelector.innerHTML = DAYS.map(function(day) {
      var training = week[day.index] !== null;
      return '' +
        '<button type="button" class="week-day ' + (training ? 'is-training' : 'is-rest') + '" ' +
          'data-weekday="' + day.index + '" aria-pressed="' + training + '">' +
          '<strong>' + day.short + '</strong>' +
          '<span>' + (training ? 'Workout' : 'Rest') + '</span>' +
        '</button>';
    }).join('');

    weekSummary.textContent =
      selectedDays.length + (selectedDays.length === 1 ? ' training' : ' workouts') +
      ' · ' + (7 - selectedDays.length) + (7 - selectedDays.length === 1 ? ' rest day' : ' rest days');

    dayCounter.textContent =
      selectedDays.length + (selectedDays.length === 1 ? ' day' : ' days');

    warning.style.display = selectedDays.length ? 'none' : 'block';
    warning.textContent = 'Choose at least 1 workout day.';
  }

  function renderDayBlocks() {
    saveBlocksToMemory();

    var selectedDays = trainingDays();
    container.innerHTML = selectedDays.map(dayBlockHtml).join('');
  }

  function toggleDay(index) {
    saveBlocksToMemory();

    if (week[index] === null) {
      week[index] = createDayData(index);
    } else {
      week[index] = null;
    }

    renderWeek();
    renderDayBlocks();
  }

  function loadEdit() {
    if (!editingPlan) return;

    document.title = 'FERRO — Edit plan';
    document.getElementById('page-title').textContent = 'Edit plan';
    document.getElementById('mode-info').textContent =
      'Change the days of the week and manage the exercises for each workout.';
    document.getElementById('save-button').textContent = 'Save changes';
    document.getElementById('plan-name').value = editingPlan.name || '';

    DAYS.forEach(function(day) {
      week[day.index] = null;
    });

    (editingPlan.days || []).forEach(function(day, index) {
      // Planos antigos não tinham weekday; convertemos a ordem antiga (segunda-domingo) para domingo-sábado.
      var indexWeek = Number.isInteger(day.weekday) ? day.weekday : ((index + 1) % 7);
      if (indexWeek >= 0 && indexWeek <= 6) {
        week[indexWeek] = createDayData(indexWeek, day);
      }
    });

    renderWeek();
    renderDayBlocks();
  }

  weekSelector.addEventListener('click', function(e) {
    var button = e.target.closest('[data-weekday]');
    if (!button) return;
    toggleDay(parseInt(button.getAttribute('data-weekday'), 10));
  });

  container.addEventListener('click', function(e) {
    if (e.target.classList.contains('add-row-btn')) {
      var list = e.target.previousElementSibling;
      list.insertAdjacentHTML('beforeend', exerciseRowHtml());
      return;
    }

    if (e.target.classList.contains('remove-row')) {
      var row = e.target.closest('.exercise-row');
      var list = row.parentElement;

      if (list.children.length > 1) {
        row.remove();
      } else {
        row.querySelectorAll('input').forEach(function(input) { input.value = ''; });
      }
      return;
    }

    if (e.target.classList.contains('list-item')) {
      var dropdown = e.target.closest('.dropdown');
      var isOpen = dropdown.classList.contains('open');

      container.querySelectorAll('.dropdown.open').forEach(function(d) {
        d.classList.remove('open');
        d.querySelector('.list-item').setAttribute('aria-expanded', 'false');
      });

      if (!isOpen) {
        dropdown.classList.add('open');
        e.target.setAttribute('aria-expanded', 'true');
      }
    }
  });

  document.getElementById('save-button').addEventListener('click', async function() {
    saveBlocksToMemory();

    var button = document.getElementById('save-button');
    var name = document.getElementById('plan-name').value.trim() || 'Workout without a name';
    var selectedDays = trainingDays();

    if (selectedDays.length === 0) {
      warning.style.display = 'block';
      warning.textContent = 'Choose at least 1 workout day before saving.';
      return;
    }

    var data = {
      name: name,
      restDays: 7 - selectedDays.length,
      days: selectedDays.map(function(index) {
        return week[index];
      })
    };

    button.disabled = true;

    try {
      if (editingPlan) {
        button.textContent = 'Saving...';
        await FerroApi.updatePlan(planId, data);
      } else {
        button.textContent = 'Creating...';
        await FerroApi.createPlan(data);
      }

      window.location.href = 'plans.html';
    } catch (error) {
      alert(error.message);
      button.disabled = false;
      button.textContent = editingPlan ? 'Save changes' : 'Save plan';
    }
  });

  document.getElementById('cancel-button').addEventListener('click', function() {
    window.location.href = 'plans.html';
  });

  async function initialize() {
    try {
      if (planId) {
        editingPlan = await FerroApi.findPlan(planId);
        loadEdit();
      } else {
        // Mantém o comportamento anterior: 3 days de training por padrão.
        week[0] = createDayData(0);
        week[1] = createDayData(1);
        week[2] = createDayData(2);
        renderWeek();
        renderDayBlocks();
      }
    } catch (error) {
      alert(error.message);
      window.location.href = 'plans.html';
    }
  }

  initialize();
</script>
</body>
</html>
