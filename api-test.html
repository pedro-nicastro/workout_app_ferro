<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FERRO — Diagnostics</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;background:#111;color:#eee}
pre{background:#1c1c1c;padding:18px;border-radius:8px;overflow:auto;white-space:pre-wrap}
button{padding:12px 18px;cursor:pointer}
.ok{color:#8f8}.error{color:#f88}
</style>
</head>
<body>
<h1>FERRO — Diagnostics</h1>
<p>This test checks communication between the browser, the Java API, and MariaDB.</p>
<button id="testar">Test connection</button>
<p id="status"></p>
<pre id="resultado">Click "Test connection".</pre>
<script>
const API='http://127.0.0.1:8081/api/health';
const status=document.getElementById('status');
const resultado=document.getElementById('resultado');
document.getElementById('testar').onclick=async()=>{
  status.textContent='Testando...'; status.className='';
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),4000);
    const r=await fetch(API,{signal:controller.signal});
    clearTimeout(timer);
    const text=await r.text();
    let data; try{data=JSON.parse(text)}catch{data=text}
    resultado.textContent=typeof data==='string'?data:JSON.stringify(data,null,2);
    if(r.ok){status.textContent='OK — API e banco responderam.'; status.className='ok';}
    else{status.textContent='API respondeu, mas o banco apresentou error.'; status.className='error';}
  }catch(e){
    status.textContent=e.name==='AbortError'?'ERROR — 4-second timeout.':'ERROR — Java API is not accessible.';
    status.className='error';
    resultado.textContent='Verifique se o backend Java está rodando em 127.0.0.1:8081.';
  }
};
</script>
</body>
</html>
